name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dataalchemy
          POSTGRES_USER: dataalchemy
          POSTGRES_PASSWORD: phase2-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataalchemy -d dataalchemy"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dataalchemy:phase2-ci@localhost:5432/dataalchemy
      TEST_DATABASE_URL: postgresql://dataalchemy_app:phase2-ci-app@localhost:5432/dataalchemy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: PGPASSWORD=phase2-ci psql -h localhost -U dataalchemy -d dataalchemy -c "CREATE ROLE dataalchemy_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'phase2-ci-app';"
      - run: uv run python scripts/migrate_postgres.py
      - run: uv run python -m compileall -q src webui
      - run: uv run ruff check src/memory src/storage src/core/agent_runtime.py src/rag/vector_store.py src/rag/retriever.py tests/test_memory_orchestrator.py tests/test_agent_runtime.py scripts/evaluate_phase2_memory.py
      # Coordinator integration needs the ROCm model runtime; pgvector coverage runs on CPU.
      - run: uv run pytest --ignore=tests/test_integration.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase2_memory.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase1_baseline.py
      - run: helm lint deploy/charts/data-alchemy
      - run: helm template data-alchemy deploy/charts/data-alchemy >/dev/null
