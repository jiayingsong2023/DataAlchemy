name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dataalchemy
          POSTGRES_USER: dataalchemy
          POSTGRES_PASSWORD: phase2-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataalchemy -d dataalchemy"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dataalchemy:phase2-ci@localhost:5432/dataalchemy
      TEST_DATABASE_URL: postgresql://dataalchemy_app:phase2-ci-app@localhost:5432/dataalchemy
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Use CPU PyTorch on the hosted runner
        run: >-
          uv pip install --reinstall-package torch --torch-backend cpu
          torch==2.9.1
      - run: cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/data-alchemy" --help
      - run: PGPASSWORD=phase2-ci psql -h localhost -U dataalchemy -d dataalchemy -c "CREATE ROLE dataalchemy_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'phase2-ci-app';"
      - run: uv run python scripts/migrate_postgres.py
      - run: uv run python -m compileall -q src webui
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Block new legacy Agent imports
        run: |
          imports="$(
            git grep -nE '^\s*(from|import) (src[.])?agents([.]|\s|$)' -- src webui scripts |
              sed -E 's/^([^:]+):[0-9]+:/\1:/' |
              sort || true
          )"
          test -z "$imports"
      - name: Block retired Operator and full-cycle bypasses
        run: |
          test -z "$(git grep -nE 'request-(ingest|full-cycle)|src/run_agents.py.*(full-cycle|schedule)' -- deploy scripts || true)"
          test ! -e scripts/build_pdf_training_candidates.py
      - name: Keep retired Agent modules out of the wheel
        run: |
          uv build --wheel --out-dir /tmp/dataalchemy-wheel
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("/tmp/dataalchemy-wheel").glob("*.whl")
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          blocked = [
              name for name in names
              if name.startswith("agents/")
              or name in {"core/agent_manager.py", "core/pipeline.py", "rag/quant_enhancer.py"}
          ]
          assert not blocked, blocked
          PY
      - run: uv run pytest
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase2_memory.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase3_pilot.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase3_pilot_rehearsal.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase4_release_candidate.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase4_internal_alpha.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase1_baseline.py
      - run: helm lint deploy/charts/data-alchemy
      - run: helm template data-alchemy deploy/charts/data-alchemy >/dev/null
      - name: Keep deployment images role-scoped
        run: |
          rendered="$(mktemp)"
          helm template data-alchemy deploy/charts/data-alchemy \
            --set images.core=r6-web:test \
            --set images.inference=r6-inference:test \
            --set images.harnessJob=r6-h5:test \
            --set images.etl=r6-etl:test >"$rendered"
          grep -q 'SPARK_IMAGE: "r6-etl:test"' "$rendered"
          grep -q 'HARNESS_JOB_IMAGE: "r6-h5:test"' "$rendered"
          grep -q 'image: r6-web:test' "$rendered"
          grep -q 'image: r6-inference:test' "$rendered"
          grep -q 'image: "r6-etl:test"' "$rendered"
      - name: Keep production inference non-privileged
        run: |
          rendered="$(mktemp)"
          helm template data-alchemy deploy/charts/data-alchemy \
            --set config.environment=production \
            --set inference.gpu.enabled=true >"$rendered"
          grep -q 'amd.com/gpu: 1' "$rendered"
          test -z "$(grep 'privileged: true' "$rendered" || true)"
      - name: Reject qualification-only services in production
        run: |
          if helm template data-alchemy deploy/charts/data-alchemy \
            --set config.environment=production \
            --set pilotRuntimes.enabled=true \
            --set pilotRuntimes.stable.webImage=stable@test \
            --set pilotRuntimes.stable.inferenceImage=stable-inference@test \
            --set pilotRuntimes.candidate.webImage=candidate@test \
            --set pilotRuntimes.candidate.inferenceImage=candidate-inference@test; then
            echo "production unexpectedly accepted qualification GPU mode" >&2
            exit 1
          fi
          if helm template data-alchemy deploy/charts/data-alchemy \
            --set config.environment=production \
            --set testIdp.enabled=true \
            --set testIdp.image=idp@test \
            --set testIdp.redirectUri=https://example.invalid/callback; then
            echo "production unexpectedly accepted the test IdP" >&2
            exit 1
          fi
      - name: Keep pilot arms immutable and isolated
        run: |
          rendered="$(mktemp)"
          digest_a=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          digest_b=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          digest_c=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          digest_d=dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          digest_e=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          helm template data-alchemy deploy/charts/data-alchemy \
            --set webui.enabled=false --set inference.enabled=false \
            --set pilotRuntimes.enabled=true \
            --set-string pilotRuntimes.stable.webImage="ghcr.io/example/data-alchemy@sha256:$digest_a" \
            --set-string pilotRuntimes.stable.inferenceImage="ghcr.io/example/data-alchemy@sha256:$digest_b" \
            --set-string pilotRuntimes.stable.modelDigest="sha256:$digest_c" \
            --set-string pilotRuntimes.stable.adapterDigest="sha256:$digest_d" \
            --set-string pilotRuntimes.candidate.webImage="ghcr.io/example/data-alchemy@sha256:$digest_a" \
            --set-string pilotRuntimes.candidate.inferenceImage="ghcr.io/example/data-alchemy@sha256:$digest_b" \
            --set-string pilotRuntimes.candidate.modelDigest="sha256:$digest_c" \
            --set-string pilotRuntimes.candidate.adapterDigest="sha256:$digest_e" >"$rendered"
          for name in webui-stable webui-candidate inference-stable inference-candidate; do
            grep -q "name: $name" "$rendered"
          done
          grep -q 'value: "http://inference-stable:8001"' "$rendered"
          grep -q 'value: "http://inference-candidate:8001"' "$rendered"
          test "$(grep -c 'amd.com/gpu: 1' "$rendered")" -eq 2
          test -z "$(grep 'privileged: true' "$rendered" || true)"
