name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dataalchemy
          POSTGRES_USER: dataalchemy
          POSTGRES_PASSWORD: phase2-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataalchemy -d dataalchemy"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dataalchemy:phase2-ci@localhost:5432/dataalchemy
      TEST_DATABASE_URL: postgresql://dataalchemy_app:phase2-ci-app@localhost:5432/dataalchemy
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Use CPU PyTorch on the hosted runner
        run: >-
          uv pip install --reinstall-package torch --torch-backend cpu
          torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1
      - run: cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/data-alchemy" --help
      - run: PGPASSWORD=phase2-ci psql -h localhost -U dataalchemy -d dataalchemy -c "CREATE ROLE dataalchemy_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'phase2-ci-app';"
      - run: uv run python scripts/migrate_postgres.py
      - run: uv run python -m compileall -q src webui
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Block new legacy Agent imports
        run: |
          imports="$(
            git grep -nE '^\s*(from|import) (src[.])?agents([.]|\s|$)' -- src webui scripts |
              sed -E 's/^([^:]+):[0-9]+:/\1:/' |
              sort
          )"
          expected="$(cat <<'EOF'
          scripts/core/benchmark_inference.py:from agents.coordinator import Coordinator
          scripts/core/verify_feedback.py:from agents.coordinator import Coordinator
          scripts/evaluate_phase1_real_tasks.py:from agents.coordinator import Coordinator
          scripts/rerollout_task_bundles.py:from agents.agent_c import AgentC
          src/core/agent_manager.py:                from agents.quant.curator import CuratorAgent
          src/core/agent_manager.py:                from agents.quant.quant_agent import QuantAgent
          src/core/agent_manager.py:                from agents.quant.scout import ScoutAgent
          src/core/agent_manager.py:                from agents.quant.validator import ValidatorAgent
          src/core/agent_manager.py:            from agents.agent_b import AgentB
          src/core/agent_manager.py:            from agents.agent_c import AgentC
          src/core/agent_manager.py:            from agents.agent_d import AgentD
          src/core/agent_manager.py:from agents.agent_a import AgentA
          src/rag/quant_enhancer.py:                from agents.quant.utils import scan_parquet_optimized
          src/run_agents.py:            from agents.coordinator import Coordinator
          src/run_agents.py:        from agents.agent_scheduler import AgentS
          webui/app.py:from agents.coordinator import Coordinator
          EOF
          )"
          test "$imports" = "$expected"
      # Coordinator integration needs the ROCm model runtime; pgvector coverage runs on CPU.
      - run: uv run pytest --ignore=tests/test_integration.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase2_memory.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase3_pilot.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase3_pilot_rehearsal.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase4_release_candidate.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase4_internal_alpha.py
      - run: DATABASE_URL="$TEST_DATABASE_URL" uv run python scripts/evaluate_phase1_baseline.py
      - run: helm lint deploy/charts/data-alchemy
      - run: helm template data-alchemy deploy/charts/data-alchemy >/dev/null
      - name: Reject privileged production WebUI
        run: |
          if helm template data-alchemy deploy/charts/data-alchemy \
            --set config.environment=production \
            --set webui.gpu.enabled=true; then
            echo "production WebUI unexpectedly accepted privileged GPU mode" >&2
            exit 1
          fi
