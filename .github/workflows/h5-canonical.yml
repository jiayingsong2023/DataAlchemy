name: Canonical runtime images

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact commit to build
        required: true
      promote:
        description: Move canonical aliases after all immutable images pass smoke tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64, h5-builder]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - name: Verify exact clean revision
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.git_sha }}"
          test -z "$(git status --porcelain)"
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable images
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/data-alchemy
          SHA: ${{ inputs.git_sha }}
        run: |
          set -eu
          : > canonical-image-digests.txt
          for spec in web:webui inference:inference h5-canonical:harness-job; do
            tag="${spec%%:*}-$SHA"
            target="${spec#*:}"
            docker build --pull --target "$target" --build-arg BUILD_GIT_SHA="$SHA" -t "$IMAGE:$tag" .
            docker push "$IMAGE:$tag"
            digest="$(docker pull "$IMAGE:$tag" | awk '/Digest:/{print $2}')"
            test -n "$digest"
            printf '%s=%s@%s\n' "$target" "$IMAGE" "$digest" | tee -a canonical-image-digests.txt
          done
      - name: Registry-pull smoke tests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/data-alchemy
        run: |
          set -eu
          web="$(awk -F= '$1=="webui"{print $2}' canonical-image-digests.txt)"
          inference="$(awk -F= '$1=="inference"{print $2}' canonical-image-digests.txt)"
          h5="$(awk -F= '$1=="harness-job"{print $2}' canonical-image-digests.txt)"
          docker run --rm "$web" python -c "import fastapi, httpx, webui.app"
          docker run --rm "$inference" python -c \
            "import torch, transformers, peft, sentence_transformers, inference.service; assert torch.version.hip"
          docker run --rm "$inference" sh -c \
            'test -f /opt/rocm/lib/hipblaslt/library/Kernels.so-000-gfx1151.hsaco && test ! -e /opt/rocm/lib/rocfft/rocfft_kernel_cache.db'
          docker run --rm "$h5" python -c \
            "import torch, transformers, peft, datasets, harness.job_runner, harness.evaluation, memory.orchestrator; assert torch.version.hip"
      - name: Archive immutable digest set
        uses: actions/upload-artifact@v4
        with:
          name: canonical-image-digests-${{ inputs.git_sha }}
          path: canonical-image-digests.txt
          if-no-files-found: error
      - name: Promote reviewed aliases
        if: inputs.promote
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/data-alchemy
        run: |
          set -eu
          for spec in webui:web-canonical inference:inference-canonical harness-job:h5-canonical; do
            target="${spec%%:*}"
            alias="${spec#*:}"
            immutable="$(awk -F= -v target="$target" '$1==target{print $2}' canonical-image-digests.txt)"
            docker pull "$immutable"
            docker tag "$immutable" "$IMAGE:$alias"
            docker push "$IMAGE:$alias"
          done
