{{- if .Values.pilotRuntimes.enabled }}
{{- if eq .Values.config.environment "production" }}
{{- fail "pilotRuntimes.enabled is qualification-only and forbidden in production" }}
{{- end }}
{{- range $name := list "stable" "candidate" }}
{{- $runtime := index $.Values.pilotRuntimes $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-alchemy-{{ $name }}
  namespace: {{ $.Values.global.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui-{{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: webui-{{ $name }}
    dataalchemy.io/runtime: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui-{{ $name }}
  template:
    metadata:
      labels:
        app: webui-{{ $name }}
        dataalchemy.io/runtime: {{ $name }}
    spec:
      serviceAccountName: data-alchemy-{{ $name }}
      {{- with $.Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webui
          image: {{ required (printf "pilotRuntimes.%s.image is required" $name) $runtime.image }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          command: ["python", "-m", "uvicorn", "webui.app:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: data-alchemy-config
            - secretRef:
                name: data-alchemy-secrets
          env:
            - name: RUNTIME_VARIANT
              value: {{ $name | quote }}
            - name: IMAGE_DIGEST
              value: {{ required (printf "pilotRuntimes.%s.imageDigest is required" $name) $runtime.imageDigest | quote }}
            - name: H5_LORA_MODE
              value: {{ $runtime.h5LoraMode | quote }}
            - name: MODEL_RELEASE_TENANT_ID
              value: {{ $runtime.modelReleaseTenantId | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.pilotRuntimes.resources | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: webui-{{ $name }}
  namespace: {{ $.Values.global.namespace }}
spec:
  selector:
    app: webui-{{ $name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
{{- end }}
