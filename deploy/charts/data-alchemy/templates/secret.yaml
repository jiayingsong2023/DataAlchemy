apiVersion: v1
kind: Secret
metadata:
  name: data-alchemy-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  AUTH_SECRET_KEY: {{ .Values.credentials.authSecretKey | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.credentials.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.credentials.awsSecretAccessKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.credentials.deepseekApiKey | quote }}
  DEEPSEEK_BASE_URL: {{ .Values.credentials.deepseekBaseUrl | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.postgresPassword | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.credentials.postgresAppPassword | quote }}
  POSTGRES_VERIFIER_PASSWORD: {{ .Values.credentials.postgresVerifierPassword | quote }}
  {{- if .Values.credentials.databaseUrl }}
  DATABASE_URL: {{ .Values.credentials.databaseUrl | quote }}
  VERIFIER_DATABASE_URL: {{ .Values.credentials.verifierDatabaseUrl | quote }}
  {{- else if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgresql.%s.svc:5432/%s" .Values.postgresql.appUsername .Values.credentials.postgresAppPassword .Values.global.namespace .Values.postgresql.database | quote }}
  VERIFIER_DATABASE_URL: {{ printf "postgresql://%s:%s@postgresql.%s.svc:5432/%s" .Values.postgresql.verifierUsername .Values.credentials.postgresVerifierPassword .Values.global.namespace .Values.postgresql.database | quote }}
  {{- else }}
  DATABASE_URL: ""
  VERIFIER_DATABASE_URL: ""
  {{- end }}
