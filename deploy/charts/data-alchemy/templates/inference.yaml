{{- if .Values.inference.enabled }}
{{- $resources := deepCopy .Values.inference.resources }}
{{- if .Values.inference.gpu.enabled }}
{{- $_ := set $resources.limits "amd.com/gpu" 1 }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: {{ .Values.global.namespace }}
  labels:
    app: inference
spec:
  replicas: {{ .Values.inference.replicas }}
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
      annotations:
        dataalchemy.io/build-git-sha: {{ .Values.config.buildGitSha | quote }}
    spec:
      serviceAccountName: data-alchemy-sa
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inference
          image: {{ .Values.images.inference }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: data-alchemy-config
            - secretRef:
                name: data-alchemy-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: shared-data
              mountPath: /app/data
          resources:
            {{- toYaml $resources | nindent 12 }}
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: data-alchemy-shared
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: inference
  ports:
    - name: http
      port: 8001
      targetPort: http
{{- end }}
