# Default values for data-alchemy.
# This is a YAML-formatted file.

global:
  namespace: data-alchemy
  storageClass: "local-path"

persistence:
  hostPath:
    enabled: true
    path: "/data"  # Path inside the K3d node (mapped from host)

images:
  core: "data-alchemy:web"
  inference: "data-alchemy:inference"
  harnessJob: "data-alchemy:h5"
  etl: "data-alchemy:etl"
  operator: "dataalchemy-operator:latest"
  pullPolicy: Never
  pullSecrets: []

config:
  environment: "development"
  buildGitSha: "unknown"
  executionMode: "local"
  authMode: "local"
  disableDefaultAdmin: "false"
  dataDir: "/app/data"
  modelDir: "/app/data/models"
  sparkJarsDir: "/app/data/spark-jars"
  s3Bucket: "data-alchemy"
  disableGpu: "false"
  # Local k3d only: mounts /dev/kfd and /dev/dri into H5 model Jobs.
  harnessJobGpuEnabled: "false"
  # Local GPU-enabled k3d only: nested containerd requires privileged device access.
  harnessJobGpuPrivileged: "false"
  harnessJobImagePullSecret: ""
  # Explicitly opt a tenant into the promoted single-tenant adapter path.
  h5LoraMode: "disabled"
  modelReleaseTenantId: ""
  inferenceUrl: "http://inference:8001"
  oidcAuthorizeUrl: ""
  oidcTokenUrl: ""
  oidcUserinfoUrl: ""
  oidcClientId: ""
  oidcRedirectUri: ""
  oidcTenantClaim: "tenant_id"
  oidcGroupRoleMap: "{}"

# Service configuration
service:
  type: ClusterIP

# Components
webui:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  ingress:
    enabled: true
    host: "data-alchemy.test"

# Two isolated HTTP runtimes for H6 shadow/canary qualification. They share the
# authoritative stores but have separate Pods, Services and ServiceAccounts.
pilotRuntimes:
  enabled: false
  stable:
    image: ""
    imageDigest: ""
    h5LoraMode: "disabled"
    modelReleaseTenantId: ""
  candidate:
    image: ""
    imageDigest: ""
    h5LoraMode: "single_tenant_lora"
    modelReleaseTenantId: ""
  resources:
    requests:
      memory: "4Gi"
      cpu: "1"
    limits:
      memory: "12Gi"
      cpu: "8"

inference:
  enabled: true
  replicas: 1
  gpu:
    enabled: false
    rocmHostPath: ""
  resources:
    requests:
      memory: "4Gi"
      cpu: "1"
    limits:
      memory: "16Gi"
      cpu: "8"

# A deterministic OIDC provider for non-production interoperability tests.
testIdp:
  enabled: false
  image: ""
  clientId: "data-alchemy-test"
  redirectUri: ""
  subject: "pilot-admin"
  tenantId: "rtd-q5-test"
  groups: "admins"

operator:
  enabled: true
  replicas: 1
  # Path inside the k3d node where host data is mounted
  hostDataPath: "/data"

postgresql:
  enabled: false
  image: "pgvector/pgvector:pg16"
  database: "dataalchemy"
  username: "dataalchemy"
  appUsername: "dataalchemy_app"
  verifierUsername: "dataalchemy_verifier"
  storage: "20Gi"
  backup:
    enabled: false
    schedule: "0 2 * * *"


# Credentials (should be in Secrets in production)
credentials:
  authSecretKey: ""
  awsAccessKeyId: "admin"
  awsSecretAccessKey: "minioadmin"
  deepseekApiKey: "YOUR_API_KEY_HERE"  # Set via --set or read from .env in helm-deploy.sh
  deepseekBaseUrl: "https://api.deepseek.com"
  databaseUrl: ""
  verifierDatabaseUrl: ""
  postgresPassword: ""
  postgresAppPassword: ""
  postgresVerifierPassword: ""
  oidcClientSecret: ""
  inferenceApiToken: "development-only"
