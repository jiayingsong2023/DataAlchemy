# Default values for data-alchemy.
# This is a YAML-formatted file.

global:
  namespace: data-alchemy
  storageClass: "local-path"

persistence:
  hostPath:
    enabled: true
    path: "/data"  # Path inside the K3d node (mapped from host)

images:
  core: "data-alchemy:latest"
  harnessJob: "data-alchemy:h5"
  operator: "dataalchemy-operator:latest"
  pullPolicy: Never

config:
  environment: "development"
  buildGitSha: "unknown"
  executionMode: "local"
  disableDefaultAdmin: "false"
  dataDir: "/app/data"
  modelDir: "/app/data/models"
  sparkJarsDir: "/app/data/spark-jars"
  s3Bucket: "data-alchemy"
  disableGpu: "false"
  # Local k3d only: mounts /dev/kfd and /dev/dri into H5 model Jobs.
  harnessJobGpuEnabled: "false"
  # Local GPU-enabled k3d only: nested containerd requires privileged device access.
  harnessJobGpuPrivileged: "false"
  # Explicitly opt a tenant into the promoted single-tenant adapter path.
  h5LoraMode: "disabled"
  modelReleaseTenantId: ""

# Service configuration
service:
  type: ClusterIP

# Components
webui:
  enabled: true
  replicas: 1
  # Nested k3s/containerd cannot expose ROCm devices to a restricted Pod.
  # Enable only on a GPU-enabled k3d cluster; the deployment gate verifies it.
  gpu:
    enabled: false
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  ingress:
    enabled: true
    host: "data-alchemy.test"

coordinator:
  # Legacy compatibility only. R3 deployments must not start this workload.
  enabled: false
  replicas: 1
  interval: "24"
  synthesis: true
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

operator:
  enabled: true
  replicas: 1
  # Path inside the k3d node where host data is mounted
  hostDataPath: "/data"

postgresql:
  enabled: false
  image: "pgvector/pgvector:pg16"
  database: "dataalchemy"
  username: "dataalchemy"
  appUsername: "dataalchemy_app"
  verifierUsername: "dataalchemy_verifier"
  storage: "20Gi"
  backup:
    enabled: false
    schedule: "0 2 * * *"


# Extra Jobs (disabled by default)
jobs:
  fullCycle:
    enabled: false
    resources:
      requests:
        memory: "8Gi"
        cpu: "2000m"
      limits:
        memory: "16Gi"
        cpu: "4000m"

# Credentials (should be in Secrets in production)
credentials:
  authSecretKey: ""
  awsAccessKeyId: "admin"
  awsSecretAccessKey: "minioadmin"
  deepseekApiKey: "YOUR_API_KEY_HERE"  # Set via --set or read from .env in helm-deploy.sh
  deepseekBaseUrl: "https://api.deepseek.com"
  databaseUrl: ""
  verifierDatabaseUrl: ""
  postgresPassword: ""
  postgresAppPassword: ""
  postgresVerifierPassword: ""
