  <path d="M1195 515 H1230" class="edge"/>
  <path d="M1125 430 V455 H1215 V515 H1230" class="edge"/>
  <path d="M1430 515 H1495 V430" class="edge"/>
  <text x="805" y="575" class="label">本地模式忽略 adapter intuition；云模式才融合 RAG / Memory context 与 adapter intuition。</text>
