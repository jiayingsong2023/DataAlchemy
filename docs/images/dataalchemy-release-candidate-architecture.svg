<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
  <title id="title">DataAlchemy controllable agent platform driven by a data loop</title>
  <desc id="description">One integrated architecture flow from governed data ingress to grounded answers, with memory distillation and governed LoRA learning from both fine-clean-derived SFT candidates and reviewed interaction trajectories.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-loop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 32px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #475569; }
      .lane-title { font: 700 17px system-ui, sans-serif; fill: #334155; }
      .node { stroke-width: 2; rx: 12; }
      .node-title { font: 700 16px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 13px system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .bidirectional { marker-start: url(#arrow-start); }
      .dashed { stroke-dasharray: 8 7; }
      .loop { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow-loop); }
      .divider { stroke: #dbe3ec; stroke-width: 2; }
      .label { font: 12px system-ui, sans-serif; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#ffffff"/>
  <text x="60" y="52" class="title">DataAlchemy：数据闭环驱动的可控智能体平台</text>
  <text x="60" y="82" class="subtitle">受控接入 → rough / fine clean → RAG / Memory → 证据回答与可选融合 → 反馈、蒸馏与学习</text>

  <text x="60" y="122" class="lane-title">控制与治理</text>
