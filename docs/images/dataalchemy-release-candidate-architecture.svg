<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">DataAlchemy controllable agent platform driven by a data loop</title>
  <desc id="description">Single-agent runtime, governed Git and PDF/DOCX ingress, PostgreSQL authority, grounded answers or abstention, optional Presidio-gated cloud fusion, and controlled GPU learning.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #475569; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .group-title { font: 700 18px system-ui, sans-serif; fill: #334155; }
      .node { stroke-width: 2; rx: 12; }
      .node-title { font: 700 17px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 14px system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .bidirectional { marker-start: url(#arrow-start); }
      .dashed { stroke-dasharray: 8 7; }
      .label { font: 13px system-ui, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="70" y="65" class="title">DataAlchemy：数据闭环驱动的可控智能体平台</text>
  <text x="70" y="95" class="subtitle">受控接入 → 可引用问答 → 记忆与反馈 → 评测训练 → 受控发布</text>

  <rect x="55" y="135" width="700" height="350" class="group"/>
  <text x="80" y="170" class="group-title">控制面：身份、编排、工具与治理</text>
  <rect x="80" y="205" width="150" height="78" class="node" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="155" y="238" class="node-title">WebUI / API</text>
  <text x="155" y="263" class="node-text">聊天 · 审批 · 控制台</text>
  <rect x="250" y="205" width="135" height="78" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="317" y="238" class="node-title">OIDC + PKCE</text>
  <text x="317" y="263" class="node-text">tenant / role</text>
  <rect x="405" y="205" width="150" height="78" class="node" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="480" y="238" class="node-title">AgentRuntime</text>
  <text x="480" y="263" class="node-text">Plan · Act · Observe</text>
  <rect x="575" y="205" width="150" height="78" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="650" y="238" class="node-title">Tool Gateway</text>
  <text x="650" y="263" class="node-text">RBAC · Retry · Limit</text>
  <rect x="205" y="350" width="470" height="88" class="node" fill="#fce7f3" stroke="#db2777"/>
  <text x="440" y="382" class="node-title">治理服务</text>
  <text x="440" y="407" class="node-text">策略 · 审批 · 审计 · Memory</text>
  <text x="440" y="426" class="node-text">Release · SLO · Presidio / Cloud</text>
  <path d="M230 244 H250" class="edge"/>
  <path d="M385 244 H405" class="edge"/>
  <path d="M555 244 H575" class="edge"/>
  <path d="M480 283 V350" class="edge bidirectional"/>
  <text x="488" y="322" class="label">状态/决策</text>
  <path d="M650 283 V350" class="edge bidirectional"/>
  <text x="658" y="322" class="label">策略/审计</text>

  <rect x="805" y="135" width="740" height="350" class="group"/>
  <text x="830" y="170" class="group-title">知识与持久化：唯一在线权威</text>
  <rect x="850" y="205" width="220" height="88" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="960" y="238" class="node-title">Retriever</text>
  <text x="960" y="263" class="node-text">pgvector + FTS → RRF</text>
  <text x="960" y="282" class="node-text">精排 · 证据回答/拒答</text>
  <rect x="1130" y="195" width="360" height="112" class="node" fill="#d1fae5" stroke="#059669"/>
  <text x="1310" y="232" class="node-title">PostgreSQL + pgvector</text>
  <text x="1310" y="257" class="node-text">任务 · 事件 · 审批 · 文档 · chunks · 记忆</text>
  <text x="1310" y="278" class="node-text">ACL · 审计 · 发布记录 · Tenant RLS</text>
  <rect x="930" y="360" width="205" height="78" class="node" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1032" y="393" class="node-title">Redis</text>
  <text x="1032" y="418" class="node-text">TTL 会话 · 缓存 · 锁 · 队列</text>
  <rect x="1200" y="360" width="230" height="78" class="node" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1315" y="393" class="node-title">MinIO</text>
  <text x="1315" y="418" class="node-text">原始对象 · manifest · 备份</text>
  <path d="M1070 249 H1130" class="edge"/>
  <path d="M1135 399 H1200" class="edge"/>
  <path d="M725 244 H850" class="edge"/>

  <rect x="55" y="540" width="1490" height="220" class="group"/>
  <text x="80" y="575" class="group-title">Git 与 PDF/DOCX 试点接入：先落地、后清洗、再原子发布</text>
  <rect x="100" y="620" width="190" height="82" class="node" fill="#f1f5f9" stroke="#64748b"/>
  <text x="195" y="653" class="node-title">GitHub / WebUI 上传</text>
  <text x="195" y="678" class="node-text">Git · PDF/DOCX · ACL</text>
  <rect x="370" y="620" width="190" height="82" class="node" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="465" y="653" class="node-title">受控接入</text>
  <text x="465" y="678" class="node-text">版本 · 游标 · manifest</text>
  <rect x="640" y="620" width="205" height="82" class="node" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="742" y="653" class="node-title">Raw Landing</text>
  <text x="742" y="678" class="node-text">MinIO raw + 登记</text>
  <rect x="925" y="610" width="255" height="102" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="1052" y="643" class="node-title">Ingress / Rough Gate</text>
  <text x="1052" y="668" class="node-text">类型 · 路径 · 大小 · UTF-8 · 密钥</text>
  <text x="1052" y="687" class="node-text">规范化 · Markdown / Recursive 分块</text>
  <rect x="1260" y="620" width="220" height="82" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1370" y="653" class="node-title">原子发布</text>
  <text x="1370" y="678" class="node-text">documents + chunks + ACL</text>
  <path d="M290 661 H370" class="edge"/>
  <path d="M560 661 H640" class="edge"/>
  <path d="M845 661 H925" class="edge"/>
  <path d="M1180 661 H1260" class="edge"/>
  <path d="M1370 620 V510 H1310 V307" class="edge"/>

  <rect x="55" y="815" width="1490" height="145" class="group"/>
  <text x="80" y="850" class="group-title">条件扩展（不在默认在线路径）</text>
  <rect x="80" y="875" width="295" height="55" class="node" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="227" y="899" class="node-title">Jira · Confluence · Git PR</text>
  <text x="227" y="919" class="node-text">Feedback（外部连接器待接入）</text>
  <rect x="455" y="875" width="265" height="55" class="node" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="587" y="899" class="node-title">Spark rough clean</text>
  <text x="587" y="919" class="node-text">PDF/DOCX · 历史回灌</text>
  <rect x="800" y="875" width="255" height="55" class="node" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="927" y="899" class="node-title">K3d + Helm + Operator</text>
  <text x="927" y="919" class="node-text">Spark / LoRA GPU Job</text>
  <rect x="1135" y="875" width="330" height="55" class="node" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1300" y="899" class="node-title">Email / 邮箱连接器：待实现</text>
  <text x="1300" y="919" class="node-text">不属于当前发布候选能力</text>
  <path d="M375 902 H455" class="edge dashed"/>
  <path d="M800 902 H720" class="edge dashed"/>
  <path d="M587 875 V760 H742 V702" class="edge dashed"/>
</svg>
